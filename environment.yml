name: dubstepr-py
channels:
  - conda-forge
dependencies:
  # python 3.12 and anndata >=0.13.4 go together and are not arbitrary.
  # pandas 3.0 made pyarrow-backed strings the default (PDEP-14), and anndata
  # before 0.13 has no writer for them: saving an h5ad whose obs index is a
  # plain string index dies with
  #   IORegistryError: No method registered for writing ArrowStringArray
  # anndata 0.13.4 handles it, and anndata 0.13 requires python >=3.12.
  # Verified in container/dubstepr-py.def: python 3.12.15, pandas 3.0.6,
  # anndata 0.13.4 -> h5ad round-trips cleanly.
  - python>=3.12
  - numpy>=1.22
  - scipy>=1.9
  - pandas>=1.4
  - anndata>=0.13.4
  - pytest
  - pip
